<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 3D Assistant</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "../node_modules/three/build/three.module.js",
        "three/addons/": "../node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <div class="app-container">
    <!-- Header -->
    <header class="window-header">
      <div class="brand-section">
        <div class="brand-icon"></div>
        <span class="brand-title">AURA AI</span>
      </div>
      <div class="header-actions">
        <button id="pin-btn" class="icon-btn" title="Toggle Always on Top">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="17" x2="12" y2="22"></line>
            <path d="M5 17h14v-2l-2-3V5a2 2 0 0 0-2-2h-6a2 2 0 0 0-2 2v7l-2 3v2z"></path>
          </svg>
        </button>
        <button id="settings-btn" class="icon-btn" title="Settings">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path
              d="M19.1 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
            </path>
          </svg>
        </button>
        <button id="minimize-btn" class="icon-btn" title="Minimize">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
        <button id="close-btn" class="icon-btn close-btn" title="Hide to Tray">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- 3D Interactive Avatar Canvas -->
    <section class="avatar-section">
      <div id="status-pill" class="status-pill status-idle">
        <span class="status-dot"></span>
        <span id="status-text">Online & Ready</span>
      </div>
      <div id="avatar-canvas-container"></div>
      <div class="shortcut-hint">Press Alt+Space anytime</div>
    </section>

    <!-- Chat & Interaction Section -->
    <section class="chat-section">
      <div id="messages-list" class="messages-list">
        <div class="message message-assistant">
          <div class="message-bubble">
            Hello! I am Aura, your interactive 3D assistant. Move your cursor or click me in 3D, talk via microphone, or
            ask me anything!
          </div>
          <div class="message-time">Just now</div>
        </div>
      </div>

      <!-- Quick Suggestion Chips -->
      <div class="suggestion-chips">
        <button class="chip-btn" data-prompt="What can you do?">What can you do?</button>
        <button class="chip-btn" data-prompt="Tell me a fun fact">Fun fact</button>
        <button class="chip-btn" data-prompt="System status">System status</button>
        <button class="chip-btn" data-prompt="How do I change themes?">Themes</button>
      </div>

      <!-- Chat Input Controls -->
      <div class="input-container">
        <button id="mic-btn" class="action-btn mic-btn" title="Toggle Voice / Microphone">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
        </button>
        <input type="text" id="chat-input" class="chat-input" placeholder="Ask anything, or speak..."
          autocomplete="off">
        <button id="send-btn" class="action-btn send-btn" title="Send message">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </section>

    <!-- Settings Overlay Modal -->
    <div id="settings-modal" class="modal-overlay hidden">
      <div class="modal-content">
        <h3 class="modal-title">Assistant Settings</h3>

        <div class="setting-row">
          <label for="theme-select">3D Avatar Theme</label>
          <select id="theme-select" class="setting-select">
            <option value="cyan">Cyber Cyan</option>
            <option value="purple">Neon Purple</option>
            <option value="emerald">Emerald Matrix</option>
            <option value="gold">Solar Gold</option>
          </select>
        </div>

        <div class="setting-row">
          <label for="llm-provider">LLM Provider</label>
          <select id="llm-provider" class="setting-select">
            <option value="mock">Built-in Intelligent Engine (Offline)</option>
            <option value="fastapi">FastAPI Local Backend (Phase 1/4)</option>
            <option value="ollama">Ollama Local (http://localhost:11434)</option>
            <option value="openai">OpenAI Compatible API</option>
          </select>
        </div>

        <div class="setting-row">
          <label for="api-endpoint">API Endpoint URL</label>
          <input type="text" id="api-endpoint" class="setting-input" value="http://localhost:8000/api/chat">
        </div>

        <div class="setting-row">
          <label for="api-key">API Key (Optional)</label>
          <input type="password" id="api-key" class="setting-input" placeholder="sk-...">
        </div>

        <div class="setting-checkbox-row">
          <label for="tts-toggle">Voice Text-to-Speech (TTS)</label>
          <input type="checkbox" id="tts-toggle" checked>
        </div>

        <div class="modal-footer">
          <button id="close-settings-btn" class="btn-primary">Done</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>

</html>
